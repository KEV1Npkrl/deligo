name: Java and MySQL
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: deligo_test
          MYSQL_USER: deligo_test
          MYSQL_PASSWORD: ephemeral-test-password
          MYSQL_ROOT_PASSWORD: ephemeral-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify with MySQL
        run: >-
          mvn -B -ntp verify
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/deligo_test
          -Dspring.datasource.username=deligo_test
          -Dspring.datasource.password=ephemeral-test-password
      - name: Check frontend syntax
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/assets/figma-ui.js
          node --test src/test/frontend/flows.cjs
